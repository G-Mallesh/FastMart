
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Login | FAST MART</title>
    <style>
        body {
            margin: 0;
            padding: 24px;
            font-family: Arial, sans-serif;
            background: #101827;
            color: white;
        }
        main {
            max-width: 420px;
            margin: 60px auto;
            background: #1d2a40;
            padding: 24px;
            border-radius: 16px;
        }
        h1 { color: #55f2a5; }
        input, button {
            width: 100%;
            padding: 13px;
            margin: 10px 0 16px;
            box-sizing: border-box;
            border-radius: 7px;
        }
        input {
            border: 1px solid #52647d;
            background: #101827;
            color: white;
        }
        button {
            border: 0;
            background: #55f2a5;
            color: #102018;
            font-weight: bold;
            cursor: pointer;
        }
        a { color: #55f2a5; }
        .message { color: #ffd166; }
    </style>
</head>
<body>
<main>
    <h1>FAST MART 👤 Login</h1>
    <p>Log in to shop or manage deliveries.</p>

    {% with messages = get_flashed_messages() %}
      {% for message in messages %}
        <p class="message">{{ message }}</p>
      {% endfor %}
    {% endwith %}

    <form method="POST">
        <label for="email">Email address</label>
        <input id="email" name="email" type="email"
               required maxlength="254" autocomplete="username">

        <label for="password">Password</label>
        <input id="password" name="password" type="password"
               required maxlength="128" autocomplete="current-password">

        <button type="submit">Log In</button>
    </form>

    <p>New to FAST MART? <a href="/register">Create an account</a></p>
    <p><a href="/">Back to store</a></p>
</main>
</body>
</html>
